services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-meteo10}
      MYSQL_USER: ${DB_USER:-meteo10}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meteo10}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-meteo10-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-meteo10-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
